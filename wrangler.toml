# Cloudflare Worker — intellistudy.
# A Worker script (src/worker.js) serves the dashboard's static assets AND a small
# API (chat, study runner, merged state), and runs autonomous study on a cron.
# `wrangler dev` runs it locally via workerd (no Cloudflare login); `wrangler deploy`
# ships the same code + ./public to <name>.<account>.workers.dev.
name = "usai"
main = "src/worker.js"
compatibility_date = "2026-06-18"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
# Static assets are served first; /api/* runs the Worker (chat agent, studies,
# benchmarks, runs). Everything else (the workbench UI) serves from ./public.
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

# Persistent store for findings + live benchmark scores. `wrangler dev` simulates
# this locally with no account. For deploy, create a namespace and paste its id:
#   npx wrangler kv namespace create USAI_KV   (or use the Cloudflare dashboard/MCP)
[[kv_namespaces]]
binding = "USAI_KV"
id = "3cbf7af7c8354f2fafffc1e87fabdccb"

# Hourly: reap pods past TTL (money safety), drain the benchmark run queue
# (~15-minute budget), and on Mondays 13:00 UTC run the weekly scan digest.
[triggers]
crons = ["0 * * * *"]

# Secrets (never put values here):
#   ANTHROPIC_API_KEY — required for chat + benchmark runs
#     local: .dev.vars (ANTHROPIC_API_KEY=sk-ant-...)   cloud: npx wrangler secret put ANTHROPIC_API_KEY
#   ACCESS_TOKEN — shared key; when set, /api/* and /mcp require the x-usai-key
#     header. Recommended: chat and runs spend YOUR Anthropic tokens.
#   RUNPOD_API_KEY — optional; enables open-weight pod provisioning (vLLM on RunPod)
#   HF_TOKEN — optional; passed to pods for gated HF repos (e.g. Llama)
