services:
  hub:
    build: .
    ports:
      - "8787:8787"
    volumes:
      # Hot-edit canonical data, views, Worker code, and config without rebuilding.
      - ./public:/app/public
      - ./src:/app/src
      - ./wrangler.toml:/app/wrangler.toml
    environment:
      # Keep wrangler fully local/offline — no Cloudflare account or telemetry.
      - WRANGLER_SEND_METRICS=false
      # Pass a key through to enable live chat + autonomous study (optional):
      #   ANTHROPIC_API_KEY=sk-ant-... docker compose up --build
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
